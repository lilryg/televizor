name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm test
      - name: Compare WebRTC profiles in Chromium
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run test:webrtc
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
          VITE_ICE_SERVERS: ${{ vars.VITE_ICE_SERVERS }}
      - if: github.event_name != 'pull_request'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
        run: |
          node --input-type=module -e '
            const url = new URL(process.env.VITE_SUPABASE_URL)
            const key = process.env.VITE_SUPABASE_KEY
            if (url.protocol !== "https:" || !key?.startsWith("sb_publishable_"))
              throw new Error("Set the Supabase URL and publishable key in GitHub Actions variables")
          '
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
